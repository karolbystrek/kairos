services:
  nginx:
    image: nginx:1.28-alpine
    environment:
      KAIROS_API_HOST:
      KAIROS_CUSTOMER_APP_HOST:
      KAIROS_NGINX_LISTEN:
      KAIROS_NGINX_REAL_IP_CONFIGURATION:
      KAIROS_NGINX_TLS_CONFIGURATION:
      KAIROS_PANEL_APP_HOST:
      NGINX_ENVSUBST_FILTER:
    volumes:
      - type: bind
        source: ./nginx/default.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      api:
        condition: service_healthy
      customer-app:
        condition: service_healthy
      panel-app:
        condition: service_healthy
    networks:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  customer-app:
    image: kairos-customer-app:local
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  panel-app:
    image: kairos-panel-app:local
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    image: kairos-api:local
    environment:
      ZITADEL_API_URL:
      ZITADEL_TOKEN_LOCATION:
      NEXT_PUBLIC_API_BASE_URL:
      NEXT_PUBLIC_CUSTOMER_APP_URL:
      PANEL_APP_URL:
      POSTGRES_DB:
      KAIROS_DB_OWNER_USER:
      KAIROS_DB_OWNER_PASSWORD:
      KAIROS_DB_RUNTIME_USER:
      KAIROS_DB_RUNTIME_PASSWORD:
      PUSH_DESTINATION_POLICY:
      REDIS_HOST:
      REDIS_PASSWORD:
      REDIS_PORT:
      VAPID_SUBJECT:
      WEBHOOK_DESTINATION_POLICY:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zitadel-bootstrap:
        condition: service_completed_successfully
    volumes:
      - zitadel-api-credentials:/run/zitadel:ro
    networks:
      - gateway
      - data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.19.4
    user: "0"
    command: ["start-from-init", "--masterkeyFile", "/run/secrets/zitadel-masterkey", "--tlsMode", "disabled"]
    environment:
      ZITADEL_EXTERNALDOMAIN:
      ZITADEL_EXTERNALPORT:
      ZITADEL_EXTERNALSECURE:
      ZITADEL_TLS_ENABLED:
      ZITADEL_DATABASE_POSTGRES_HOST:
      ZITADEL_DATABASE_POSTGRES_PORT:
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_DB}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:?Set ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE:
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE:
      ZITADEL_FIRSTINSTANCE_ORG_NAME:
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD:
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME:
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME:
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE:
      ZITADEL_FIRSTINSTANCE_PATPATH:
      ZITADEL_DEFAULTINSTANCE_DOMAINPOLICY_USERLOGINMUSTBEDOMAIN:
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_MINLENGTH:
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_HASLOWERCASE:
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_HASUPPERCASE:
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_HASNUMBER:
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_HASSYMBOL:
      ZITADEL_DEFAULTINSTANCE_PASSWORDAGEPOLICY_MAXAGEDAYS:
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWEXTERNALIDP:
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER:
      ZITADEL_DEFAULTINSTANCE_NOTIFICATIONPOLICY_PASSWORDCHANGE:
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED:
    volumes:
      - zitadel-bootstrap-credentials:/bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  zitadel-bootstrap:
    image: python:3.14-alpine
    command: ["python", "/bootstrap-script/bootstrap.py"]
    volumes:
      - zitadel-bootstrap-credentials:/bootstrap:ro
      - zitadel-api-credentials:/credentials
      - ./deployment/zitadel/bootstrap.py:/bootstrap-script/bootstrap.py:ro
    depends_on:
      zitadel:
        condition: service_healthy
    networks:
      - data
    restart: "no"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB:
      POSTGRES_PASSWORD:
      POSTGRES_USER:
      KAIROS_DB_OWNER_USER:
      KAIROS_DB_OWNER_PASSWORD:
      KAIROS_DB_RUNTIME_USER:
      KAIROS_DB_RUNTIME_PASSWORD:
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deployment/postgres/bootstrap.sh:/docker-entrypoint-initdb.d/10-kairos-roles.sh:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD:
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    networks:
      - data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD}\" ]; then REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping; else redis-cli ping; fi | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
  zitadel-bootstrap-credentials:
  zitadel-api-credentials:

networks:
  gateway:
  data:
    internal: true
