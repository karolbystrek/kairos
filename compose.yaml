services:
  postgres:
    image: postgres:18-alpine
    container_name: kairos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: kairos-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  api:
    container_name: kairos-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
    depends_on:
      - postgres
      - redis
    develop:
      watch:
        - action: sync+exec
          path: ./apps/api/src
          target: /app/src
          initial_sync: true
          exec:
            command: ./mvnw compile -DskipTests
            working_dir: /app
        - action: rebuild
          path: ./apps/api/pom.xml
    restart: unless-stopped

  customer-app:
    container_name: kairos-customer-app
    build:
      context: ./apps/customer-app
      dockerfile: Dockerfile
      target: development
    expose:
      - "3000"
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./apps/customer-app
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./apps/customer-app/package.json
        - action: rebuild
          path: ./apps/customer-app/package-lock.json
    restart: unless-stopped

  panel-app:
    container_name: kairos-panel-app
    build:
      context: ./apps/panel-app
      dockerfile: Dockerfile
      target: development
    expose:
      - "3000"
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./apps/panel-app
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./apps/panel-app/package.json
        - action: rebuild
          path: ./apps/panel-app/package-lock.json
    restart: unless-stopped

  caddy:
    container_name: kairos-caddy
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - customer-app
      - panel-app
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
