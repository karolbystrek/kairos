services:
  nginx:
    image: nginx:1.28-alpine
    environment:
      KAIROS_API_HOST: ${KAIROS_API_HOST}
      KAIROS_CUSTOMER_APP_HOST: ${KAIROS_CUSTOMER_APP_HOST}
      KAIROS_PANEL_APP_HOST: ${KAIROS_PANEL_APP_HOST}
      NGINX_ENVSUBST_FILTER: ^KAIROS_
    volumes:
      - type: bind
        source: ./nginx/default.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      api:
        condition: service_healthy
      customer-app:
        condition: service_healthy
      panel-app:
        condition: service_healthy
    networks:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  customer-app:
    image: kairos-customer-app:local
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  panel-app:
    image: kairos-panel-app:local
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    image: kairos-api:local
    environment:
      JWT_ISSUER:
      NEXT_PUBLIC_API_BASE_URL:
      NEXT_PUBLIC_CUSTOMER_APP_URL:
      PANEL_APP_URL:
      POSTGRES_DB:
      POSTGRES_PASSWORD:
      POSTGRES_USER:
      PUSH_DESTINATION_POLICY:
      REDIS_HOST:
      REDIS_PASSWORD:
      REDIS_PORT:
      VAPID_SUBJECT:
      WEBHOOK_DESTINATION_POLICY:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gateway
      - data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    networks:
      - data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD}\" ]; then REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping; else redis-cli ping; fi | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:

networks:
  gateway:
  data:
    internal: true
