# Shared infrastructure. compose.local.yaml adds the applications in Docker with hot reload;
# compose.production.yaml adds the application images and NGINX.
name: kairos

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB:
      POSTGRES_PASSWORD:
      POSTGRES_USER:
      KAIROS_DB_OWNER_USER:
      KAIROS_DB_OWNER_PASSWORD:
      KAIROS_DB_RUNTIME_USER:
      KAIROS_DB_RUNTIME_PASSWORD:
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deployment/postgres/bootstrap.sh:/docker-entrypoint-initdb.d/10-kairos-roles.sh:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD:
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "200mb",
        "--maxmemory-policy",
        "volatile-lru",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD}\" ]; then REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping; else redis-cli ping; fi | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:

networks:
  data:
