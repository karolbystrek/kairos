# Hosted overlay on compose.yaml: application images, NGINX HTTPS ingress, private networking and limits.
x-deployment-logging: &deployment-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.28-alpine
    environment:
      KAIROS_API_HOST:
      KAIROS_CUSTOMER_APP_HOST:
      KAIROS_NGINX_LISTEN: "443 ssl"
      KAIROS_NGINX_REAL_IP_CONFIGURATION: "include /etc/nginx/cloudflare-real-ip.conf;"
      KAIROS_NGINX_TLS_CONFIGURATION: |-
        ssl_certificate /run/secrets/tls/tls.crt;
        ssl_certificate_key /run/secrets/tls/tls.key;
      KAIROS_PANEL_APP_HOST:
      NGINX_ENVSUBST_FILTER:
    ports:
      - "443:443"
    secrets:
      - tls
    volumes:
      - type: bind
        source: ./nginx/default.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/cloudflare-real-ip.conf
        target: /etc/nginx/cloudflare-real-ip.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/api-locations.conf
        target: /etc/nginx/api-locations.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      api:
        condition: service_healthy
      customer-app:
        condition: service_healthy
      panel-app:
        condition: service_healthy
    networks:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.50
    logging: *deployment-logging

  customer-app:
    image: ${KAIROS_IMAGE_REGISTRY:?Set KAIROS_IMAGE_REGISTRY}/customer-app:${KAIROS_RELEASE_VERSION:?Set KAIROS_RELEASE_VERSION}
    build:
      context: ./apps/customer-app
      dockerfile: ../panel-app/Dockerfile
      target: runner
      args:
        NEXT_TELEMETRY_DISABLED:
    environment:
      CUSTOMER_APP_URL:
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    logging: *deployment-logging

  panel-app:
    image: ${KAIROS_IMAGE_REGISTRY:?Set KAIROS_IMAGE_REGISTRY}/panel-app:${KAIROS_RELEASE_VERSION:?Set KAIROS_RELEASE_VERSION}
    build:
      context: ./apps/panel-app
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_TELEMETRY_DISABLED:
    environment:
      CUSTOMER_APP_URL:
      PANEL_APP_URL:
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    logging: *deployment-logging

  api:
    image: ${KAIROS_IMAGE_REGISTRY:?Set KAIROS_IMAGE_REGISTRY}/api:${KAIROS_RELEASE_VERSION:?Set KAIROS_RELEASE_VERSION}
    build:
      context: ./apps/api
      target: runner
    # Hosted releases select immutable images with --no-build.
    # The owner of the 0400 secret files; deploy.py and setup.sh --prod supply it.
    user: "${KAIROS_API_USER:?Set KAIROS_API_USER to the uid:gid owning the secrets directory}"
    environment:
      EMAIL_DELIVERY_MODE: RESEND
      EMAIL_VERIFICATION_ENABLED: "${EMAIL_VERIFICATION_ENABLED:-true}"
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY for production email delivery}
      REVIEW_INVITATION_DELAY: "${REVIEW_INVITATION_DELAY:-30m}"
      CUSTOMER_APP_URL:
      PANEL_APP_URL:
      POSTGRES_HOST:
      POSTGRES_DB:
      KAIROS_DB_OWNER_USER:
      KAIROS_DB_OWNER_PASSWORD:
      KAIROS_DB_RUNTIME_USER:
      KAIROS_DB_RUNTIME_PASSWORD:
      KAIROS_SECRETS_DIRECTORY:
      PUSH_DESTINATION_POLICY:
      REDIS_HOST:
      REDIS_PASSWORD:
      REDIS_PORT:
      VAPID_SUBJECT:
      WEBHOOK_DESTINATION_POLICY:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - email-encryption.bin
      - webhook-encryption.bin
      - vapid-private.pem
      - vapid-public.pem
      - push-subscription-encryption.bin
    networks:
      - gateway
      - data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 25s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.50
    logging: *deployment-logging

  # Infrastructure stays on the private network; only NGINX publishes a port.
  postgres:
    ports: !reset []
    mem_limit: 1g
    cpus: 1.00
    logging: *deployment-logging

  redis:
    ports: !reset []
    mem_limit: 256m
    cpus: 0.50
    logging: *deployment-logging

# File secrets are read-only bind mounts at /run/secrets/<name>; a missing source fails startup.
secrets:
  email-encryption.bin:
    file: ${KAIROS_APPLICATION_SECRETS_DIRECTORY:-./secrets}/email-encryption.bin
  webhook-encryption.bin:
    file: ${KAIROS_APPLICATION_SECRETS_DIRECTORY:-./secrets}/webhook-encryption.bin
  vapid-private.pem:
    file: ${KAIROS_APPLICATION_SECRETS_DIRECTORY:-./secrets}/vapid-private.pem
  vapid-public.pem:
    file: ${KAIROS_APPLICATION_SECRETS_DIRECTORY:-./secrets}/vapid-public.pem
  push-subscription-encryption.bin:
    file: ${KAIROS_APPLICATION_SECRETS_DIRECTORY:-./secrets}/push-subscription-encryption.bin
  tls:
    file: ${KAIROS_TLS_DIRECTORY:?Set KAIROS_TLS_DIRECTORY}

networks:
  gateway:
  data:
    internal: true
