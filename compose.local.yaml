services:
  nginx:
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - type: bind
        source: ./secrets/tls
        target: /run/secrets/tls
        read_only: true
        bind:
          create_host_path: false

  customer-app:
    build:
      context: ./apps/customer-app
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED}

  panel-app:
    build:
      context: ./apps/panel-app
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_CUSTOMER_APP_URL: ${NEXT_PUBLIC_CUSTOMER_APP_URL}
        NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED}

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runner
    volumes:
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
