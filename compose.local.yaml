services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  zitadel:
    ports:
      - "127.0.0.1:8081:8080"

  # The host-run API reads the provisioned PAT from secrets/zitadel instead of a private volume.
  zitadel-bootstrap:
    volumes:
      - ./secrets/zitadel:/credentials

  customer-app:
    build:
      context: ./apps/customer-app
      # Both frontends share one Next.js Dockerfile; each keeps its own context and .dockerignore.
      dockerfile: ../panel-app/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL:
        NEXT_PUBLIC_CUSTOMER_APP_URL:
        NEXT_TELEMETRY_DISABLED:
    ports:
      - "127.0.0.1:3000:3000"

  panel-app:
    build:
      context: ./apps/panel-app
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL:
        NEXT_PUBLIC_CUSTOMER_APP_URL:
        NEXT_PUBLIC_PANEL_APP_URL: ${PANEL_APP_URL}
        NEXT_TELEMETRY_DISABLED:
    ports:
      - "127.0.0.1:3001:3000"

  api:
    environment:
      EMAIL_DELIVERY_MODE: LOG
      REVIEW_INVITATION_DELAY: "${REVIEW_INVITATION_DELAY:-1m}"
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runner
    volumes:
      - ./secrets/zitadel:/run/zitadel:ro
    ports:
      - "127.0.0.1:8080:8080"

networks:
  # Published infrastructure ports need a non-internal network.
  data:
    internal: false
