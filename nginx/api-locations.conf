# API routing shared by every hostname: browsers reach /api on their own site, integrations on the API host.
# Included at server level, so the throttles cover every location; non-API requests have empty keys.

# Staff of one restaurant often share an IP, so allow a burst of sign-ins at once.
limit_req zone=kairos_auth burst=20 nodelay;
limit_req zone=kairos_external burst=20 nodelay;
# Unauthenticated customer notification subscriptions; guests on one Wi-Fi share an IP, so keep a small burst.
limit_req zone=kairos_customer_notifications burst=30 nodelay;

location = /api {
    return 404;
}

location = /api/actuator {
    return 404;
}

location ^~ /api/actuator/ {
    return 404;
}

# Customer and staff event streams must reach the browser as soon as the API writes them.
location ~ ^/api/(tracked-orders/v1/[^/]+|orders/v1)/events$ {
    proxy_pass http://kairos_api;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 31m;
    # Setting a header here drops the server-level ones (add_header does not merge), so restate the essentials.
    add_header X-Accel-Buffering "no" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}

location /api/ {
    proxy_pass http://kairos_api;
}
