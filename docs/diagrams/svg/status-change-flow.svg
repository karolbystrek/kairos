<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Order status notification flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font-size: 14px; font-weight: 600; }
      .sub { font-size: 12px; }
      .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
      .neutral rect { fill: #FFFFFF; stroke: #D3D1C7; }
      .neutral .title { fill: #2C2C2A; }
      .neutral .sub, .legend { fill: #5F5E5A; }
      .live rect { fill: #E1F5EE; stroke: #0F6E56; }
      .live .title { fill: #085041; }
      .live .sub { fill: #0F6E56; }
      .durable rect { fill: #EEEDFE; stroke: #534AB7; }
      .durable .title { fill: #3C3489; }
      .durable .sub { fill: #534AB7; }
    </style>
  </defs>
  <rect width="680" height="540" fill="#FAF9F5"/>
  <g class="neutral" text-anchor="middle" dominant-baseline="central">
    <rect x="240" y="20" width="200" height="44" rx="8" stroke-width="0.5"/>
    <text class="title" x="340" y="42">Staff panel or POS</text>
    <rect x="145" y="100" width="390" height="72" rx="8" stroke-width="0.5"/>
    <text class="title" x="340" y="122">One PostgreSQL transaction</text>
    <text class="sub" x="340" y="146">status + outbox event + measurement</text>
  </g>
  <line class="arr" x1="340" y1="64" x2="340" y2="98" marker-end="url(#arrow)"/>
  <path class="arr" d="M285 172 L285 200 L155 200 L155 226" marker-end="url(#arrow)"/>
  <path class="arr" d="M395 172 L395 200 L525 200 L525 226" marker-end="url(#arrow)"/>
  <text class="sub legend" x="340" y="200" text-anchor="middle" dominant-baseline="central">after commit</text>
  <g class="live" text-anchor="middle" dominant-baseline="central">
    <rect x="20" y="228" width="270" height="64" rx="8" stroke-width="0.5"/>
    <text class="title" x="155" y="250">Redis Pub/Sub</text>
    <text class="sub" x="155" y="272">one order-change channel</text>
    <rect x="20" y="328" width="270" height="64" rx="8" stroke-width="0.5"/>
    <text class="title" x="155" y="350">Every API instance</text>
    <text class="sub" x="155" y="372">subscribed to the channel</text>
    <rect x="20" y="428" width="270" height="64" rx="8" stroke-width="0.5"/>
    <text class="title" x="155" y="450">SSE streams</text>
    <text class="sub" x="155" y="472">customer and staff</text>
  </g>
  <g class="durable" text-anchor="middle" dominant-baseline="central">
    <rect x="390" y="228" width="270" height="64" rx="8" stroke-width="0.5"/>
    <text class="title" x="525" y="250">Push and webhook workers</text>
    <text class="sub" x="525" y="272">woken after commit</text>
    <rect x="390" y="328" width="270" height="64" rx="8" stroke-width="0.5"/>
    <text class="title" x="525" y="350">Outbox fan-out</text>
    <text class="sub" x="525" y="372">one event, N deliveries</text>
    <rect x="390" y="428" width="270" height="64" rx="8" stroke-width="0.5"/>
    <text class="title" x="525" y="450">Web Push and webhooks</text>
    <text class="sub" x="525" y="472">with retries</text>
  </g>
  <line class="arr" x1="155" y1="292" x2="155" y2="326" marker-end="url(#arrow)"/>
  <line class="arr" x1="155" y1="392" x2="155" y2="426" marker-end="url(#arrow)"/>
  <line class="arr" x1="525" y1="292" x2="525" y2="326" marker-end="url(#arrow)"/>
  <line class="arr" x1="525" y1="392" x2="525" y2="426" marker-end="url(#arrow)"/>
  <g class="live"><rect x="90" y="510" width="14" height="14" rx="3" stroke-width="0.5"/></g>
  <text class="sub legend" x="112" y="517" dominant-baseline="central">fast, not durable</text>
  <g class="durable"><rect x="410" y="510" width="14" height="14" rx="3" stroke-width="0.5"/></g>
  <text class="sub legend" x="432" y="517" dominant-baseline="central">durable, at least once</text>
</svg>
