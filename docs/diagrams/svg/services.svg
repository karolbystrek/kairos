<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Kairos services overview</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font-size: 14px; font-weight: 600; }
      .sub { font-size: 12px; }
      .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
      .neutral rect { fill: #FFFFFF; stroke: #D3D1C7; }
      .neutral .title { fill: #2C2C2A; }
      .neutral .sub, .label { fill: #5F5E5A; }
      .app rect { fill: #E1F5EE; stroke: #0F6E56; }
      .app .title { fill: #085041; }
      .app .sub { fill: #0F6E56; }
      .core rect { fill: #EEEDFE; stroke: #534AB7; }
      .core .title { fill: #3C3489; }
      .core .sub { fill: #534AB7; }
    </style>
  </defs>
  <rect width="680" height="420" fill="#FAF9F5"/>
  <g class="neutral" text-anchor="middle" dominant-baseline="central">
    <rect x="20" y="30" width="130" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="85" y="48">Customer</text>
    <text class="sub" x="85" y="68">browser</text>
    <rect x="20" y="100" width="130" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="85" y="118">Staff</text>
    <text class="sub" x="85" y="138">browser</text>
    <rect x="20" y="180" width="130" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="85" y="198">POS system</text>
    <text class="sub" x="85" y="218">REST API</text>
    <rect x="180" y="30" width="90" height="206" rx="8" stroke-width="0.5"/>
    <text class="title" x="225" y="122">NGINX</text>
    <text class="sub" x="225" y="142">HTTPS</text>
    <rect x="490" y="180" width="170" height="46" rx="8" stroke-width="0.5"/>
    <text class="title" x="575" y="203">Web Push services</text>
    <rect x="490" y="240" width="170" height="46" rx="8" stroke-width="0.5"/>
    <text class="title" x="575" y="263">Email provider</text>
    <rect x="300" y="330" width="160" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="380" y="348">PostgreSQL</text>
    <text class="sub" x="380" y="368">source of truth</text>
    <rect x="490" y="330" width="170" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="575" y="348">Redis</text>
    <text class="sub" x="575" y="368">event Pub/Sub</text>
  </g>
  <g class="app" text-anchor="middle" dominant-baseline="central">
    <rect x="300" y="30" width="160" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="380" y="48">customer-app</text>
    <text class="sub" x="380" y="68">Next.js PWA</text>
    <rect x="300" y="100" width="160" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="380" y="118">panel-app</text>
    <text class="sub" x="380" y="138">Next.js</text>
  </g>
  <g class="core" text-anchor="middle" dominant-baseline="central">
    <rect x="300" y="180" width="160" height="100" rx="8" stroke-width="0.5"/>
    <text class="title" x="380" y="212">API</text>
    <text class="sub" x="380" y="234">Spring Boot</text>
    <text class="sub" x="380" y="252">REST, SSE, workers</text>
  </g>
  <line class="arr" x1="150" y1="58" x2="178" y2="58" marker-end="url(#arrow)"/>
  <line class="arr" x1="150" y1="128" x2="178" y2="128" marker-end="url(#arrow)"/>
  <line class="arr" x1="150" y1="208" x2="178" y2="208" marker-end="url(#arrow)"/>
  <line class="arr" x1="270" y1="58" x2="298" y2="58" marker-end="url(#arrow)"/>
  <line class="arr" x1="270" y1="128" x2="298" y2="128" marker-end="url(#arrow)"/>
  <line class="arr" x1="270" y1="208" x2="298" y2="208" marker-end="url(#arrow)"/>
  <line class="arr" x1="460" y1="203" x2="488" y2="203" marker-end="url(#arrow)"/>
  <line class="arr" x1="460" y1="263" x2="488" y2="263" marker-end="url(#arrow)"/>
  <line class="arr" x1="380" y1="280" x2="380" y2="328" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="arr" d="M440 280 L440 305 L575 305 L575 328" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="arr" d="M320 280 L320 308 L85 308 L85 238" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text class="sub label" x="190" y="294" text-anchor="middle" dominant-baseline="central">signed webhook</text>
</svg>
