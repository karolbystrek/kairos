# Host-run API (./mvnw spring-boot:run from apps/api) against the local Compose infrastructure.
spring:
  config:
    import: "optional:file:../../.env[.properties]"
  datasource:
    url: "jdbc:postgresql://localhost:5432/${POSTGRES_DB}"
  data:
    redis:
      host: localhost
  devtools:
    livereload:
      enabled: false

kairos:
  email:
    mode: LOG
    encryption-key-location: "file:../../secrets/email-encryption.bin"
  authentication:
    # ZITADEL picks its instance from the request host, so the host maps zitadel to 127.0.0.1.
    base-url: "http://zitadel:8081"
    token-location: "file:../../secrets/zitadel/kairos.pat"
  webhooks:
    signing:
      encryption-key-location: "file:../../secrets/webhook-encryption.bin"
  review-invitations:
    delay: 1m
  customer-notifications:
    vapid:
      public-key-location: "file:../../secrets/vapid-public.pem"
      private-key-location: "file:../../secrets/vapid-private.pem"
    subscription:
      encryption-key-location: "file:../../secrets/push-subscription-encryption.bin"
