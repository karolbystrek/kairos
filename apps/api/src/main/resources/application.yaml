spring:
  application:
    name: api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  data:
    redis:
      repositories:
        enabled: false
  mvc:
    problemdetails:
      enabled: true

server:
  forward-headers-strategy: framework
  servlet:
    context-path: /api

kairos:
  authentication:
    jwt:
      issuer: https://api.localhost
      audience: kairos-panel
      access-lifetime: 5m
      public-key-location: "${KAIROS_AUTHENTICATION_JWT_PUBLIC_KEY_LOCATION}"
      private-key-location: "${KAIROS_AUTHENTICATION_JWT_PRIVATE_KEY_LOCATION}"
    refresh:
      idle-lifetime: 7d
      absolute-lifetime: 30d
    password:
      bcrypt-strength: 12
