spring:
  config:
    # The host-run API (./mvnw spring-boot:run in apps/api) reads the repository .env;
    # containers have no such file and receive the same keys as environment variables.
    import: "optional:file:../../.env[.properties]"
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
      platform: postgresql
  application:
    name: api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  task:
    scheduling:
      pool:
        # A long purge or analytics run must not delay email and heartbeats; kept small for one VPS.
        size: 2
  datasource:
    url: "jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/${POSTGRES_DB}"
    username: "${KAIROS_DB_RUNTIME_USER}"
    password: "${KAIROS_DB_RUNTIME_PASSWORD}"
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    user: "${KAIROS_DB_OWNER_USER}"
    password: "${KAIROS_DB_OWNER_PASSWORD}"
    placeholders:
      runtimeUser: "${KAIROS_DB_RUNTIME_USER}"
  data:
    redis:
      host: "${REDIS_HOST}"
      port: "${REDIS_PORT}"
      password: "${REDIS_PASSWORD}"
      repositories:
        enabled: false
  mvc:
    problemdetails:
      enabled: true

server:
  forward-headers-strategy: framework
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    enable:
      http.client.requests: false

kairos:
  email:
    mode: ${EMAIL_DELIVERY_MODE:RESEND}
    api-key: ${RESEND_API_KEY:}
    encryption-key-location: "file:${KAIROS_SECRETS_DIRECTORY:/run/secrets}/email-encryption.bin"
  monitoring:
    token-location: "${KAIROS_MONITORING_TOKEN_LOCATION:file:/run/secrets/metrics-token}"
  origins:
    customer: "${NEXT_PUBLIC_CUSTOMER_APP_URL}"
    panel: "${PANEL_APP_URL}"
  authentication:
    email-verification-enabled: ${EMAIL_VERIFICATION_ENABLED:true}
  webhooks:
    signing:
      encryption-key-location: "file:${KAIROS_SECRETS_DIRECTORY:/run/secrets}/webhook-encryption.bin"
      rotation-overlap: 24h
    delivery:
      total-timeout: 10s
      maximum-response-body-bytes: 16384
    worker:
      batch-size: 50
      claim-lease: 30s
      recovery-poll-delay: 5s
      initial-delay: 1s
    destination-policy: "${WEBHOOK_DESTINATION_POLICY:PUBLIC_HTTPS}"
  review-invitations:
    delay: "${REVIEW_INVITATION_DELAY:30m}"
  retention:
    grace-period: 30d
    order-expiry: 24h
    batch-size: 50
    purge-delay: 1h
    purge-initial-delay: 10m
  customer-notifications:
    vapid:
      public-key-location: "file:${KAIROS_SECRETS_DIRECTORY:/run/secrets}/vapid-public.pem"
      private-key-location: "file:${KAIROS_SECRETS_DIRECTORY:/run/secrets}/vapid-private.pem"
      subject: "${VAPID_SUBJECT:mailto:kairos@localhost}"
    subscription:
      encryption-key-location: "file:${KAIROS_SECRETS_DIRECTORY:/run/secrets}/push-subscription-encryption.bin"
      maximum-enrollments-per-order: 10
      dormant-retention: 30d
    delivery:
      freshness-window: 10m
      maximum-attempts: 8
      initial-retry-delay: 5s
      maximum-retry-delay: 2m
      total-timeout: 10s
      successful-retention: 7d
      failed-retention: 30d
      maximum-payload-bytes: 3072
    worker:
      batch-size: 50
      claim-lease: 30s
      recovery-poll-delay: 5s
      initial-delay: 1s
      cleanup-delay: 1h
      cleanup-initial-delay: 5m
    destination-policy: "${PUSH_DESTINATION_POLICY:PUBLIC_HTTPS}"
