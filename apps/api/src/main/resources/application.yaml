spring:
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
      platform: postgresql
  application:
    name: api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  datasource:
    url: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
    username: "${KAIROS_DB_RUNTIME_USER}"
    password: "${KAIROS_DB_RUNTIME_PASSWORD}"
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    url: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
    user: "${KAIROS_DB_OWNER_USER}"
    password: "${KAIROS_DB_OWNER_PASSWORD}"
    placeholders:
      runtimeUser: "${KAIROS_DB_RUNTIME_USER}"
  data:
    redis:
      host: "${REDIS_HOST}"
      port: "${REDIS_PORT}"
      password: "${REDIS_PASSWORD}"
      repositories:
        enabled: false
  mvc:
    problemdetails:
      enabled: true

server:
  forward-headers-strategy: framework
  servlet:
    context-path: /api

kairos:
  origins:
    customer: "${NEXT_PUBLIC_CUSTOMER_APP_URL}"
    panel: "${PANEL_APP_URL}"
    api: "${NEXT_PUBLIC_API_BASE_URL}"
  authentication:
    base-url: "${ZITADEL_API_URL:http://zitadel:8080}"
    token-location: "${ZITADEL_TOKEN_LOCATION:file:/run/zitadel/kairos.pat}"
  webhooks:
    signing:
      encryption-key-location: "file:/run/secrets/webhook-encryption.bin"
      rotation-overlap: 24h
    delivery:
      total-timeout: 10s
      maximum-response-body-bytes: 16384
    worker:
      batch-size: 50
      claim-lease: 30s
      fanout-poll-delay: 500ms
      delivery-poll-delay: 500ms
      initial-delay: 1s
    destination-policy: "${WEBHOOK_DESTINATION_POLICY:PUBLIC_HTTPS}"
  review-invitations:
    delay: "${REVIEW_INVITATION_DELAY:30m}"
  customer-notifications:
    vapid:
      public-key-location: "file:/run/secrets/vapid-public.pem"
      private-key-location: "file:/run/secrets/vapid-private.pem"
      subject: "${VAPID_SUBJECT:mailto:kairos@localhost}"
    subscription:
      encryption-key-location: "file:/run/secrets/push-subscription-encryption.bin"
      maximum-enrollments-per-order: 10
      dormant-retention: 30d
    delivery:
      freshness-window: 10m
      maximum-attempts: 8
      initial-retry-delay: 5s
      maximum-retry-delay: 2m
      total-timeout: 10s
      successful-retention: 7d
      failed-retention: 30d
      maximum-payload-bytes: 3072
    worker:
      batch-size: 50
      claim-lease: 30s
      fanout-poll-delay: 500ms
      delivery-poll-delay: 500ms
      initial-delay: 1s
      cleanup-delay: 1h
      cleanup-initial-delay: 5m
    destination-policy: "${PUSH_DESTINATION_POLICY:PUBLIC_HTTPS}"
