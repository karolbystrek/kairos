spring:
  application:
    name: api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  data:
    redis:
      repositories:
        enabled: false
  mvc:
    problemdetails:
      enabled: true

server:
  forward-headers-strategy: framework
  servlet:
    context-path: /api

kairos:
  browser-cors:
    customer-origin: "${NEXT_PUBLIC_CUSTOMER_APP_URL}"
    panel-origin: "${PANEL_APP_URL}"
  authentication:
    jwt:
      issuer: https://api.localhost
      audience: kairos-panel
      access-lifetime: 5m
      public-key-location: "${KAIROS_AUTHENTICATION_JWT_PUBLIC_KEY_LOCATION}"
      private-key-location: "${KAIROS_AUTHENTICATION_JWT_PRIVATE_KEY_LOCATION}"
    refresh:
      idle-lifetime: 7d
      absolute-lifetime: 30d
    password:
      bcrypt-strength: 12
  webhooks:
    signing:
      encryption-key-location: "${KAIROS_WEBHOOK_ENCRYPTION_KEY_LOCATION}"
      rotation-overlap: 24h
    delivery:
      total-timeout: 10s
      maximum-response-body-bytes: 16384
    worker:
      batch-size: 50
      claim-lease: 30s
      fanout-poll-delay: 500ms
      delivery-poll-delay: 500ms
      initial-delay: 1s
    destination-policy: "${KAIROS_WEBHOOK_DESTINATION_POLICY:PUBLIC_HTTPS}"
  customer-notifications:
    vapid:
      public-key-location: "${KAIROS_PUSH_VAPID_PUBLIC_KEY_LOCATION}"
      private-key-location: "${KAIROS_PUSH_VAPID_PRIVATE_KEY_LOCATION}"
      subject: "${KAIROS_PUSH_VAPID_SUBJECT}"
    subscription:
      encryption-key-location: "${KAIROS_PUSH_SUBSCRIPTION_ENCRYPTION_KEY_LOCATION}"
      maximum-enrollments-per-order: 10
      dormant-retention: 30d
    delivery:
      freshness-window: 10m
      maximum-attempts: 8
      initial-retry-delay: 5s
      maximum-retry-delay: 2m
      total-timeout: 10s
      successful-retention: 7d
      failed-retention: 30d
      maximum-payload-bytes: 3072
    worker:
      batch-size: 50
      claim-lease: 30s
      fanout-poll-delay: 500ms
      delivery-poll-delay: 500ms
      initial-delay: 1s
      cleanup-delay: 1h
      cleanup-initial-delay: 5m
    destination-policy: "${KAIROS_PUSH_DESTINATION_POLICY:PUBLIC_HTTPS}"
