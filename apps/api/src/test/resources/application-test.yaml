# Overrides only: the main application.yaml is loaded too (profile "test", activated by PostgresLauncherSessionListener).
spring:
  data:
    redis:
      # The main file requires these from the environment. Nothing listens on port 1, so tests never reach a
      # developer's Redis; tests that need Redis set the container's values.
      host: localhost
      port: 1
      password: ""

kairos:
  email:
    mode: LOG
    initial-delay: 1h
    poll-delay: 1h
    api-key: ""
    encryption-key-location: "classpath:keys/test-email-encryption.bin"
  analytics:
    initial-delay: 24h
  origins:
    customer: "http://localhost:3000"
    panel: "http://localhost:3001"
  webhooks:
    signing:
      encryption-key-location: "classpath:keys/test-webhook-encryption.bin"
    worker:
      batch-size: 10
      initial-delay: 24h
    destination-policy: LOCAL_DEVELOPMENT
  live-updates:
    resync-interval: 24h
  retention:
    batch-size: 10
    purge-initial-delay: 24h
  customer-notifications:
    vapid:
      public-key-location: "classpath:keys/test-vapid-public.pem"
      private-key-location: "classpath:keys/test-vapid-private.pem"
      subject: "mailto:test@kairos.local"
    subscription:
      encryption-key-location: "classpath:keys/test-webhook-encryption.bin"
    worker:
      batch-size: 10
      initial-delay: 24h
      cleanup-initial-delay: 24h
    destination-policy: LOCAL_DEVELOPMENT
