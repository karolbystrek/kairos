spring:
  application:
    name: api
  datasource:
    url: "jdbc:h2:mem:kairos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE"
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false

server:
  servlet:
    context-path: /api

kairos:
  browser-cors:
    customer-origin: "http://localhost:3000"
    panel-origin: "http://localhost:3001"
  authentication:
    jwt:
      issuer: https://api.localhost
      audience: kairos-panel
      access-lifetime: 5m
      public-key-location: "classpath:keys/test-jwt-public.pem"
      private-key-location: "classpath:keys/test-jwt-private.pem"
    refresh:
      idle-lifetime: 7d
      absolute-lifetime: 30d
    password:
      bcrypt-strength: 4
  webhooks:
    signing:
      encryption-key-location: "classpath:keys/test-webhook-encryption.bin"
      rotation-overlap: 24h
    delivery:
      total-timeout: 10s
      maximum-response-body-bytes: 16384
    worker:
      batch-size: 10
      claim-lease: 30s
      fanout-poll-delay: 500ms
      delivery-poll-delay: 500ms
      initial-delay: 24h
    destination-policy: LOCAL_DEVELOPMENT
  customer-notifications:
    vapid:
      public-key-location: "classpath:keys/test-vapid-public.pem"
      private-key-location: "classpath:keys/test-vapid-private.pem"
      subject: "mailto:test@kairos.local"
    subscription:
      encryption-key-location: "classpath:keys/test-webhook-encryption.bin"
      maximum-enrollments-per-order: 10
      dormant-retention: 30d
    delivery:
      freshness-window: 10m
      maximum-attempts: 8
      initial-retry-delay: 5s
      maximum-retry-delay: 2m
      total-timeout: 10s
      successful-retention: 7d
      failed-retention: 30d
      maximum-payload-bytes: 3072
    worker:
      batch-size: 10
      claim-lease: 30s
      fanout-poll-delay: 500ms
      delivery-poll-delay: 500ms
      initial-delay: 24h
      cleanup-delay: 1h
      cleanup-initial-delay: 24h
    destination-policy: LOCAL_DEVELOPMENT
