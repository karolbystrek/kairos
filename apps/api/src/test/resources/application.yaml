spring:
  profiles:
    active: test
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
      platform: postgresql
  application:
    name: api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false

server:
  servlet:
    context-path: /api

kairos:
  email:
    mode: LOG
    initial-delay: 1h
    poll-delay: 1h
    api-key: ""
    encryption-key-location: "classpath:keys/test-email-encryption.bin"
  analytics:
    initial-delay: 24h
  origins:
    customer: "http://localhost:3000"
    panel: "http://localhost:3001"
  webhooks:
    signing:
      encryption-key-location: "classpath:keys/test-webhook-encryption.bin"
      rotation-overlap: 24h
    delivery:
      total-timeout: 10s
      maximum-response-body-bytes: 16384
    worker:
      batch-size: 10
      claim-lease: 30s
      recovery-poll-delay: 5s
      initial-delay: 24h
    destination-policy: LOCAL_DEVELOPMENT
  retention:
    grace-period: 30d
    order-expiry: 24h
    batch-size: 10
    purge-delay: 1h
    purge-initial-delay: 24h
  customer-notifications:
    vapid:
      public-key-location: "classpath:keys/test-vapid-public.pem"
      private-key-location: "classpath:keys/test-vapid-private.pem"
      subject: "mailto:test@kairos.local"
    subscription:
      encryption-key-location: "classpath:keys/test-webhook-encryption.bin"
      maximum-enrollments-per-order: 10
      dormant-retention: 30d
    delivery:
      freshness-window: 10m
      maximum-attempts: 8
      initial-retry-delay: 5s
      maximum-retry-delay: 2m
      total-timeout: 10s
      successful-retention: 7d
      failed-retention: 30d
      maximum-payload-bytes: 3072
    worker:
      batch-size: 10
      claim-lease: 30s
      recovery-poll-delay: 5s
      initial-delay: 24h
      cleanup-delay: 1h
      cleanup-initial-delay: 24h
    destination-policy: LOCAL_DEVELOPMENT
