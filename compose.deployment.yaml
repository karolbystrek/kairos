x-deployment-logging: &deployment-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    environment:
      KAIROS_NGINX_LISTEN: "443 ssl"
      KAIROS_NGINX_TLS_CONFIGURATION: |-
        ssl_certificate /run/secrets/tls/tls.crt;
        ssl_certificate_key /run/secrets/tls/tls.key;
      KAIROS_NGINX_REAL_IP_CONFIGURATION: "include /etc/nginx/cloudflare-real-ip.conf;"
    ports:
      - "443:443"
    volumes:
      - type: bind
        source: ${KAIROS_TLS_DIRECTORY:?Set KAIROS_TLS_DIRECTORY to an absolute external certificate directory}
        target: /run/secrets/tls
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/cloudflare-real-ip.conf
        target: /etc/nginx/cloudflare-real-ip.conf
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 128m
    cpus: 0.50
    logging: *deployment-logging

  customer-app:
    image: ${KAIROS_IMAGE_REGISTRY:?Set KAIROS_IMAGE_REGISTRY}/customer-app:${KAIROS_RELEASE_VERSION:?Set KAIROS_RELEASE_VERSION}
    mem_limit: 512m
    cpus: 0.75
    logging: *deployment-logging

  panel-app:
    image: ${KAIROS_IMAGE_REGISTRY:?Set KAIROS_IMAGE_REGISTRY}/panel-app:${KAIROS_RELEASE_VERSION:?Set KAIROS_RELEASE_VERSION}
    mem_limit: 512m
    cpus: 0.75
    logging: *deployment-logging

  api:
    image: ${KAIROS_IMAGE_REGISTRY:?Set KAIROS_IMAGE_REGISTRY}/api:${KAIROS_RELEASE_VERSION:?Set KAIROS_RELEASE_VERSION}
    mem_limit: 1g
    cpus: 1.50
    logging: *deployment-logging
    volumes:
      - type: bind
        source: ${KAIROS_APPLICATION_SECRETS_DIRECTORY:?Set KAIROS_APPLICATION_SECRETS_DIRECTORY}/webhook-encryption.bin
        target: /run/secrets/webhook-encryption.bin
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${KAIROS_APPLICATION_SECRETS_DIRECTORY:?Set KAIROS_APPLICATION_SECRETS_DIRECTORY}/vapid-private.pem
        target: /run/secrets/vapid-private.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${KAIROS_APPLICATION_SECRETS_DIRECTORY:?Set KAIROS_APPLICATION_SECRETS_DIRECTORY}/vapid-public.pem
        target: /run/secrets/vapid-public.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${KAIROS_APPLICATION_SECRETS_DIRECTORY:?Set KAIROS_APPLICATION_SECRETS_DIRECTORY}/push-subscription-encryption.bin
        target: /run/secrets/push-subscription-encryption.bin
        read_only: true
        bind:
          create_host_path: false

  zitadel:
    mem_limit: 1g
    cpus: 1.00
    logging: *deployment-logging
    volumes:
      - type: bind
        source: ${KAIROS_APPLICATION_SECRETS_DIRECTORY:?Set KAIROS_APPLICATION_SECRETS_DIRECTORY}/zitadel-masterkey
        target: /run/secrets/zitadel-masterkey
        read_only: true
        bind:
          create_host_path: false

  zitadel-bootstrap:
    mem_limit: 128m
    cpus: 0.25
    logging: *deployment-logging

  postgres:
    mem_limit: 1g
    cpus: 1.00
    logging: *deployment-logging

  redis:
    mem_limit: 256m
    cpus: 0.50
    logging: *deployment-logging
