name: Deploy production
run-name: Deploy production (latest main)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  publish:
    name: Publish release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    concurrency:
      group: publish-${{ github.sha }}
      cancel-in-progress: false
    env:
      IMAGE_REGISTRY: ghcr.io/${{ github.repository }}
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Find validated CI images
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deployment/find_ci_images.py

      - name: GHCR login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.images.outputs.run_id }}
          pattern: image-*
          merge-multiple: true
          path: images

      - name: Publish images
        shell: bash
        run: |
          for service in customer-app panel-app api; do
            image="${IMAGE_REGISTRY}/${service}:${IMAGE_TAG}"
            if skopeo inspect --raw "docker://$image" >/dev/null 2>&1; then
              echo "$image already exists; leaving it unchanged."
            else
              skopeo copy --all --preserve-digests \
                --digestfile "images/${service}.published" \
                "oci-archive:images/${service}.tar" "docker://$image"
              test "$(cat "images/${service}.digest")" = "$(cat "images/${service}.published")"
            fi
          done

      - name: Inspect images
        shell: bash
        run: |
          mkdir -p image-inspections
          for service in customer-app panel-app api; do
            image="${IMAGE_REGISTRY}/${service}:${IMAGE_TAG}"
            docker pull --platform linux/amd64 "$image"
            docker image inspect "$image" > "image-inspections/${service}.json"
          done

      - name: Verify & bundle
        env:
          RELEASE_REVISION: ${{ github.sha }}
        run: python3 deployment/release_manifest.py "$RELEASE_REVISION" image-inspections release

      - name: Upload release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: |
            release/release.json
            release/release.tar.gz
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: kairos-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.DEPLOY_AWS_REGION }}
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: "5"
      DEPLOY_INSTANCE: ${{ vars.DEPLOY_INSTANCE }}
      DEPLOY_ADMIN_CIDRS: ${{ vars.DEPLOY_ADMIN_CIDRS }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-manifest
          path: ${{ runner.temp }}/release

      - name: AWS credentials for temporary SSH access
        id: aws
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: ${{ vars.DEPLOY_AWS_REGION }}
          role-to-assume: ${{ vars.DEPLOY_AWS_ROLE_ARN }}
          role-session-name: kairos-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 7200
          allowed-account-ids: ${{ vars.DEPLOY_AWS_ACCOUNT_ID }}
          unset-current-credentials: true

      - name: Open temporary deployment SSH access
        id: firewall
        run: python3 deployment/ssh_firewall.py open

      - name: Transfer and deploy verified release
        id: deployment
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/release
          RELEASE_REVISION: ${{ github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: python3 deployment/upload_release.py "$RELEASE_DIRECTORY" "$RELEASE_REVISION"

      - name: Remove temporary deployment SSH access
        id: firewall_cleanup
        if: always() && steps.aws.outcome == 'success' && steps.firewall.outcome != 'skipped'
        env:
          FIREWALL_OPEN_OUTCOME: ${{ steps.firewall.outcome }}
        run: python3 deployment/ssh_firewall.py close

      - name: Deployment result
        if: always()
        env:
          RELEASE_REVISION: ${{ github.sha }}
          DEPLOYMENT_RESULT: ${{ steps.deployment.outcome }}
          JOB_RESULT: ${{ job.status }}
          FIREWALL_RESULT: ${{ steps.firewall_cleanup.outcome }}
        run: |
          printf '\nRevision: `%s`\n\nDeployment: **%s**; job: **%s**\n' \
            "$RELEASE_REVISION" "$DEPLOYMENT_RESULT" "$JOB_RESULT" >> "$GITHUB_STEP_SUMMARY"
          printf '\nTemporary SSH cleanup: **%s**\n' "$FIREWALL_RESULT" >> "$GITHUB_STEP_SUMMARY"
