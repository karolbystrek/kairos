name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app:
          - customer-app
          - panel-app
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_CUSTOMER_APP_URL: ${{ vars.NEXT_PUBLIC_CUSTOMER_APP_URL }}
      NEXT_PUBLIC_PANEL_APP_URL: ${{ vars.NEXT_PUBLIC_PANEL_APP_URL }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Validate build inputs
        shell: bash
        run: |
          invalid=false

          if [[ -z "${NEXT_PUBLIC_API_BASE_URL}" ]]; then
            echo "::error::Set the NEXT_PUBLIC_API_BASE_URL repository variable."
            invalid=true
          fi

          if [[ -z "${NEXT_PUBLIC_CUSTOMER_APP_URL}" ]]; then
            echo "::error::Set the NEXT_PUBLIC_CUSTOMER_APP_URL repository variable."
            invalid=true
          fi

          if [[ "${{ matrix.app }}" == "panel-app" && -z "${NEXT_PUBLIC_PANEL_APP_URL}" ]]; then
            echo "::error::Set the NEXT_PUBLIC_PANEL_APP_URL repository variable."
            invalid=true
          fi

          if [[ "${invalid}" == "true" ]]; then
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint & types
        run: npm run check

      - name: Test
        run: npm run test --if-present

      - name: Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/${{ matrix.app }}
          target: runner
          platforms: linux/amd64
          pull: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.app }}:sha-${{ github.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.app }}.tar
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_CUSTOMER_APP_URL=${{ vars.NEXT_PUBLIC_CUSTOMER_APP_URL }}
            NEXT_PUBLIC_PANEL_APP_URL=${{ vars.NEXT_PUBLIC_PANEL_APP_URL }}
            NEXT_TELEMETRY_DISABLED=1
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: mode=max

      - name: Record digest
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '%s\n' "$IMAGE_DIGEST" > "${{ runner.temp }}/${{ matrix.app }}.digest"

      - name: Upload image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.app }}
          path: |
            ${{ runner.temp }}/${{ matrix.app }}.tar
            ${{ runner.temp }}/${{ matrix.app }}.digest
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Verify
        run: ./mvnw --batch-mode verify

      - name: Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/api
          target: runner
          platforms: linux/amd64
          pull: true
          tags: ghcr.io/${{ github.repository }}/api:sha-${{ github.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/api.tar
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: mode=max

      - name: Record digest
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '%s\n' "$IMAGE_DIGEST" > "${{ runner.temp }}/api.digest"

      - name: Upload image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-api
          path: |
            ${{ runner.temp }}/api.tar
            ${{ runner.temp }}/api.digest
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  release-checks:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install bootstrap validation tools
        run: python3 -m pip install 'ansible-core==2.19.14'

      - name: Validate VM bootstrap
        run: |
          ansible-playbook -i deployment/inventory.example.ini deployment/bootstrap.yml --syntax-check
          sh tests/bootstrap-test.sh

      - name: Verify gateway and setup prerequisites
        run: |
          docker info > /dev/null
          docker compose version
          openssl version
          docker pull nginx:1.28-alpine

      - name: Test gateway and secret preservation
        run: |
          python3 tests/gateway-test.py
          sh tests/setup-test.sh
          sh tests/reset-test.sh
          python3 tests/zitadel-bootstrap-test.py

      - name: Test manifest
        run: python3 -m unittest discover -s deployment -p 'test_*.py' -v
