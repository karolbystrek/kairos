name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Only pull requests share a group, so superseded PR pushes cancel; other runs
# (including deploy.yml's call, which has no workflow-level group) never queue.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app:
          - customer-app
          - panel-app
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_CUSTOMER_APP_URL: ${{ vars.NEXT_PUBLIC_CUSTOMER_APP_URL }}
      NEXT_PUBLIC_PANEL_APP_URL: ${{ vars.NEXT_PUBLIC_PANEL_APP_URL }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Validate build inputs
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          : "${NEXT_PUBLIC_API_BASE_URL:?Set the NEXT_PUBLIC_API_BASE_URL repository variable.}"
          : "${NEXT_PUBLIC_CUSTOMER_APP_URL:?Set the NEXT_PUBLIC_CUSTOMER_APP_URL repository variable.}"
          [[ "$APP" != panel-app ]] || : "${NEXT_PUBLIC_PANEL_APP_URL:?Set the NEXT_PUBLIC_PANEL_APP_URL repository variable.}"

      - name: Dependency cache
        id: deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/${{ matrix.app }}/node_modules
          key: ${{ runner.os }}-node22-${{ matrix.app }}-${{ hashFiles(format('apps/{0}/package-lock.json', matrix.app)) }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint & types
        run: npm run check

      - name: Test
        run: npm run test --if-present

      - name: Next.js cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/${{ matrix.app }}/.next/cache
          key: ${{ runner.os }}-next-${{ matrix.app }}-${{ hashFiles(format('apps/{0}/package-lock.json', matrix.app)) }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-next-${{ matrix.app }}-${{ hashFiles(format('apps/{0}/package-lock.json', matrix.app)) }}-

      - name: Build
        run: npm run build

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Verify
        run: ./mvnw --batch-mode verify

  release-checks:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install bootstrap validation tools
        run: python3 -m pip install 'ansible-core==2.19.14'

      - name: Validate VM bootstrap
        run: |
          ansible-playbook -i deployment/inventory.example.ini deployment/bootstrap.yml --syntax-check
          sh tests/bootstrap-test.sh

      - name: Test gateway and secret preservation
        run: |
          python3 tests/gateway-test.py
          sh tests/setup-test.sh
          sh tests/reset-test.sh
          python3 tests/zitadel-bootstrap-test.py

      - name: Test manifest
        run: python3 -m unittest discover -s deployment -p 'test_*.py' -v
