name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app:
          - customer-app
          - panel-app
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_CUSTOMER_APP_URL: ${{ vars.NEXT_PUBLIC_CUSTOMER_APP_URL }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Validate public build configuration
        shell: bash
        run: |
          invalid=false

          if [[ -z "${NEXT_PUBLIC_API_BASE_URL}" ]]; then
            echo "::error::Set the NEXT_PUBLIC_API_BASE_URL repository variable."
            invalid=true
          fi

          if [[ "${{ matrix.app }}" == "panel-app" && -z "${NEXT_PUBLIC_CUSTOMER_APP_URL}" ]]; then
            echo "::error::Set the NEXT_PUBLIC_CUSTOMER_APP_URL repository variable."
            invalid=true
          fi

          if [[ "${invalid}" == "true" ]]; then
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint and type-check
        run: npm run check

      - name: Run tests when configured
        run: npm run test --if-present

      - name: Build application
        run: npm run build

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Compile and test
        run: ./mvnw --batch-mode verify

  publish:
    name: Publish (${{ matrix.service }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - frontend
      - api
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.sha }}-${{ matrix.service }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        service:
          - customer-app
          - panel-app
          - api
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.service }}
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Preserve an existing immutable image tag
        id: image
        shell: bash
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "${IMAGE}:${IMAGE_TAG} already exists; leaving it unchanged."
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and publish customer application
        if: matrix.service == 'customer-app' && steps.image.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/customer-app
          target: runner
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_TELEMETRY_DISABLED=1
          cache-from: type=gha,scope=customer-app
          cache-to: type=gha,mode=max,scope=customer-app
          provenance: mode=max

      - name: Build and publish panel application
        if: matrix.service == 'panel-app' && steps.image.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/panel-app
          target: runner
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_CUSTOMER_APP_URL=${{ vars.NEXT_PUBLIC_CUSTOMER_APP_URL }}
            NEXT_TELEMETRY_DISABLED=1
          cache-from: type=gha,scope=panel-app
          cache-to: type=gha,mode=max,scope=panel-app
          provenance: mode=max

      - name: Build and publish API
        if: matrix.service == 'api' && steps.image.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/api
          target: runner
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: mode=max
