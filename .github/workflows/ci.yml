name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app:
          - customer-app
          - panel-app
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_CUSTOMER_APP_URL: ${{ vars.NEXT_PUBLIC_CUSTOMER_APP_URL }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Validate build inputs
        shell: bash
        run: |
          invalid=false

          if [[ -z "${NEXT_PUBLIC_API_BASE_URL}" ]]; then
            echo "::error::Set the NEXT_PUBLIC_API_BASE_URL repository variable."
            invalid=true
          fi

          if [[ "${{ matrix.app }}" == "panel-app" && -z "${NEXT_PUBLIC_CUSTOMER_APP_URL}" ]]; then
            echo "::error::Set the NEXT_PUBLIC_CUSTOMER_APP_URL repository variable."
            invalid=true
          fi

          if [[ "${invalid}" == "true" ]]; then
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint & types
        run: npm run check

      - name: Test
        run: npm run test --if-present

      - name: Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/${{ matrix.app }}
          target: runner
          platforms: linux/amd64
          pull: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.app }}:sha-${{ github.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.app }}.tar
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_CUSTOMER_APP_URL=${{ vars.NEXT_PUBLIC_CUSTOMER_APP_URL }}
            NEXT_TELEMETRY_DISABLED=1
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: mode=max

      - name: Record digest
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '%s\n' "$IMAGE_DIGEST" > "${{ runner.temp }}/${{ matrix.app }}.digest"

      - name: Upload image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.app }}
          path: |
            ${{ runner.temp }}/${{ matrix.app }}.tar
            ${{ runner.temp }}/${{ matrix.app }}.digest
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Verify
        run: ./mvnw --batch-mode verify

      - name: Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/api
          target: runner
          platforms: linux/amd64
          pull: true
          tags: ghcr.io/${{ github.repository }}/api:sha-${{ github.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/api.tar
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: mode=max

      - name: Record digest
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '%s\n' "$IMAGE_DIGEST" > "${{ runner.temp }}/api.digest"

      - name: Upload image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-api
          path: |
            ${{ runner.temp }}/api.tar
            ${{ runner.temp }}/api.digest
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  release-checks:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install bootstrap validation tools
        run: python3 -m pip install 'ansible-core==2.19.14'

      - name: Validate VM bootstrap
        run: |
          ansible-playbook -i deployment/inventory.example.ini deployment/bootstrap.yml --syntax-check
          sh tests/bootstrap-test.sh

      - name: Test manifest
        run: python3 -m unittest discover -s deployment -p 'test_*.py' -v

  publish:
    name: Publish release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - frontend
      - api
      - release-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.sha }}
      cancel-in-progress: false
    env:
      IMAGE_REGISTRY: ghcr.io/${{ github.repository }}
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: GHCR login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: images

      - name: Publish images
        shell: bash
        run: |
          for service in customer-app panel-app api; do
            image="${IMAGE_REGISTRY}/${service}:${IMAGE_TAG}"
            if skopeo inspect --raw "docker://$image" >/dev/null 2>&1; then
              echo "$image already exists; leaving it unchanged."
            else
              skopeo copy --all --preserve-digests \
                --digestfile "images/${service}.published" \
                "oci-archive:images/${service}.tar" "docker://$image"
              test "$(cat "images/${service}.digest")" = "$(cat "images/${service}.published")"
            fi
          done

      - name: Inspect images
        shell: bash
        run: |
          mkdir -p image-inspections
          for service in customer-app panel-app api; do
            image="${IMAGE_REGISTRY}/${service}:${IMAGE_TAG}"
            docker pull --platform linux/amd64 "$image"
            docker image inspect "$image" > "image-inspections/${service}.json"
          done

      - name: Verify & bundle
        env:
          RELEASE_REVISION: ${{ github.sha }}
        run: python3 deployment/release_manifest.py "$RELEASE_REVISION" image-inspections release

      - name: Upload release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: |
            release/release.json
            release/release.tar.gz
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: kairos-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.DEPLOY_AWS_REGION }}
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: "5"
      DEPLOY_INSTANCE: ${{ vars.DEPLOY_INSTANCE }}
      DEPLOY_ADMIN_CIDRS: ${{ vars.DEPLOY_ADMIN_CIDRS }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-manifest
          path: ${{ runner.temp }}/release

      - name: AWS credentials for temporary SSH access
        id: aws
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: ${{ vars.DEPLOY_AWS_REGION }}
          role-to-assume: ${{ vars.DEPLOY_AWS_ROLE_ARN }}
          role-session-name: kairos-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 7200
          allowed-account-ids: ${{ vars.DEPLOY_AWS_ACCOUNT_ID }}
          unset-current-credentials: true

      - name: Open temporary deployment SSH access
        id: firewall
        run: python3 deployment/ssh_firewall.py open

      - name: Transfer and deploy verified release
        id: deployment
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/release
          RELEASE_REVISION: ${{ github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: python3 deployment/upload_release.py "$RELEASE_DIRECTORY" "$RELEASE_REVISION"

      - name: Remove temporary deployment SSH access
        id: firewall_cleanup
        if: always() && steps.aws.outcome == 'success' && steps.firewall.outcome != 'skipped'
        env:
          FIREWALL_OPEN_OUTCOME: ${{ steps.firewall.outcome }}
        run: python3 deployment/ssh_firewall.py close

      - name: Deployment result
        if: always()
        env:
          RELEASE_REVISION: ${{ github.sha }}
          DEPLOYMENT_RESULT: ${{ steps.deployment.outcome }}
          JOB_RESULT: ${{ job.status }}
          FIREWALL_RESULT: ${{ steps.firewall_cleanup.outcome }}
        run: |
          printf '\nRevision: `%s`\n\nDeployment: **%s**; job: **%s**\n' \
            "$RELEASE_REVISION" "$DEPLOYMENT_RESULT" "$JOB_RESULT" >> "$GITHUB_STEP_SUMMARY"
          printf '\nTemporary SSH cleanup: **%s**\n' "$FIREWALL_RESULT" >> "$GITHUB_STEP_SUMMARY"
