name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-production-images:
        type: boolean
        default: false

permissions:
  contents: read

# Only pull requests share a group, so superseded PR pushes cancel; other runs
# (including deploy.yml's call, which has no workflow-level group) never queue.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app:
          - customer-app
          - panel-app
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint & types
        run: npm run check

      - name: Test
        run: npm run test --if-present

      - name: Next.js cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/${{ matrix.app }}/.next/cache
          key: ${{ runner.os }}-next-${{ matrix.app }}-${{ hashFiles(format('apps/{0}/package-lock.json', matrix.app)) }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-next-${{ matrix.app }}-${{ hashFiles(format('apps/{0}/package-lock.json', matrix.app)) }}-

      - name: Build
        run: npm run build

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Verify
        run: ./mvnw --batch-mode verify

  release-checks:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Pip cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ansible-core-2.19.14

      - name: Install bootstrap validation tools
        run: python3 -m pip install 'ansible-core==2.19.14'

      - name: Validate VM bootstrap
        run: |
          ansible-playbook -i deployment/inventory.example.ini deployment/bootstrap.yml --syntax-check
          sh tests/bootstrap-test.sh

      - name: Test gateway and secret preservation
        run: |
          python3 tests/gateway-test.py
          sh tests/setup-test.sh
          sh tests/reset-test.sh

      - name: Test manifest
        run: python3 -m unittest discover -s deployment -p 'test_*.py' -v

  production-images:
    name: Production images
    if: ${{ !inputs.skip-production-images }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Placeholders: only Compose interpolation and the build need them, nothing is pushed.
      KAIROS_IMAGE_REGISTRY: ghcr.io/karolbystrek/kairos
      KAIROS_RELEASE_VERSION: ci
      KAIROS_API_USER: "1000:1000"
      KAIROS_CUSTOMER_APP_HOST: customer.example.com
      KAIROS_PANEL_APP_HOST: panel.example.com
      KAIROS_API_HOST: api.example.com
      CUSTOMER_APP_URL: https://customer.example.com
      PANEL_APP_URL: https://panel.example.com
      POSTGRES_PASSWORD: placeholder
      KAIROS_DB_OWNER_PASSWORD: placeholder
      KAIROS_DB_RUNTIME_PASSWORD: placeholder
      REDIS_PASSWORD: placeholder
      VAPID_SUBJECT: mailto:ci@example.com
      RESEND_API_KEY: placeholder
      KAIROS_APPLICATION_SECRETS_DIRECTORY: ./secrets
      KAIROS_TLS_DIRECTORY: ./tls
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate production Compose
        run: docker compose -f compose.yaml -f compose.production.yaml config -q

      - name: Validate development Compose
        run: docker compose --env-file .env.example -f compose.yaml -f compose.local.yaml config -q

      - name: Build application images
        run: docker compose -f compose.yaml -f compose.production.yaml build api panel-app customer-app
