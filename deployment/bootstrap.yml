---
- name: Prepare the Kairos Ubuntu host
  hosts: kairos
  become: true
  vars:
    kairos_deploy_user: kairos
    kairos_directory: /srv/kairos

  pre_tasks:
    - name: Validate the persistent directory and deployment identity
      ansible.builtin.assert:
        that:
          - kairos_directory is match('^/[^\n]+$')
          - kairos_directory != '/'
          - kairos_deploy_user is match('^[a-z_][a-z0-9_-]*$')
          - kairos_deploy_user != 'root'
      tags: always

    - name: Validate supported host and required public key input
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '24.04'
          - ansible_facts['architecture'] == 'x86_64'
          - kairos_deploy_public_key_file is defined
        fail_msg: Ubuntu 24.04 x86-64 and a deployment public key file are required.
      tags: host

    - name: Validate deployment key on the operator workstation
      ansible.builtin.command:
        argv: [ssh-keygen, -lf, /dev/stdin]
        stdin: "{{ lookup('ansible.builtin.file', kairos_deploy_public_key_file) }}"
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      changed_when: false
      tags: host

    - name: Require one plain OpenSSH public key
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.file', kairos_deploy_public_key_file) is match('^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)) [A-Za-z0-9+/=]+( [^\r\n]*)?$')
      tags: host

    - name: Inspect installed packages before changing the host
      ansible.builtin.package_facts:
        manager: apt
      tags: host

    - name: Refuse conflicting Docker installations rather than remove them
      ansible.builtin.assert:
        that:
          - item not in ansible_facts['packages']
        fail_msg: "Conflicting package {{ item }} requires separately reviewed removal."
      loop: [docker.io, docker-compose, docker-compose-v2, docker-doc, docker-buildx, podman-docker, containerd, runc]
      tags: host

  tasks:
    - name: Install Ubuntu host prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, git, gh, bash, python3, openssl, openssh-server, tar, coreutils, acl]
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: host

    - name: Prepare apt signing-key directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      tags: host

    - name: Download Docker's official repository signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
      tags: host

    - name: Configure Docker's official Ubuntu repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kairos-docker.sources
        mode: '0644'
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: noble
          Components: stable
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/docker.asc
      register: docker_repository
      tags: host

    - name: Install Docker Engine and Compose without upgrading existing packages
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: present
        update_cache: "{{ docker_repository.changed }}"
      tags: host

    - name: Enable Docker on boot
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started
      tags: host

    - name: Create the deployment identity with Docker access
      ansible.builtin.user:
        name: "{{ kairos_deploy_user }}"
        shell: /bin/bash
        create_home: true
        groups: docker
        append: true
        password_lock: true
      register: deployment_identity
      tags: host

    - name: Prepare deployment SSH directory
      ansible.builtin.file:
        path: "{{ deployment_identity.home }}/.ssh"
        state: directory
        owner: "{{ kairos_deploy_user }}"
        mode: '0700'
      tags: host

    - name: Install deployment key with forwarding and PTY disabled
      ansible.builtin.lineinfile:
        path: "{{ deployment_identity.home }}/.ssh/authorized_keys"
        create: true
        owner: "{{ kairos_deploy_user }}"
        mode: '0600'
        line: "restrict {{ lookup('ansible.builtin.file', kairos_deploy_public_key_file) }}"
      tags: host

    - name: Restrict SSH authentication for the deployment identity
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-kairos-deploy.conf
        mode: '0644'
        validate: /usr/sbin/sshd -t -f %s
        content: |
          Match User {{ kairos_deploy_user }}
              PasswordAuthentication no
              KbdInteractiveAuthentication no
              AllowTcpForwarding no
              AllowAgentForwarding no
              X11Forwarding no
              PermitTunnel no
              PermitTTY no
          Match all
      notify: Validate and reload SSH
      tags: host

    - name: Prepare private persistent directories
      ansible.builtin.file:
        path: "{{ kairos_directory }}/{{ item }}"
        state: directory
        owner: "{{ kairos_deploy_user }}"
        mode: '0700'
      loop: ['', releases, tls]
      tags: [host, configuration]

    - name: Prepare application configuration using the existing setup command
      become_user: "{{ kairos_deploy_user }}"
      tags: configuration
      block:
        - name: Allocate temporary setup directory
          ansible.builtin.tempfile:
            state: directory
            path: "{{ kairos_directory }}"
            prefix: .bootstrap.
          register: bootstrap_workspace

        - name: Copy setup inputs from this checkout
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../{{ item }}"
            dest: "{{ bootstrap_workspace.path }}/{{ item }}"
            mode: '0600'
          loop: [setup.sh, .env.example]

        - name: Check for existing production configuration
          ansible.builtin.stat:
            path: "{{ kairos_directory }}/production.env"
          register: production_environment

        - name: Reject non-regular production configuration
          ansible.builtin.assert:
            that:
              - not production_environment.stat.exists or production_environment.stat.isreg | default(false)
              - not production_environment.stat.islnk | default(false)

        - name: Protect existing production configuration permissions
          ansible.builtin.file:
            path: "{{ kairos_directory }}/production.env"
            mode: '0600'
          when: production_environment.stat.exists

        - name: Preserve existing production configuration during setup
          ansible.builtin.copy:
            src: "{{ kairos_directory }}/production.env"
            dest: "{{ bootstrap_workspace.path }}/.env"
            remote_src: true
            mode: '0600'
          when: production_environment.stat.exists
          no_log: true

        - name: Generate or validate application keys without replacing them
          ansible.builtin.command:
            argv:
              - sh
              - "{{ bootstrap_workspace.path }}/setup.sh"
              - --non-interactive
              - --keep-env
              - --keep-keys
              - --no-tls
              - --secrets-directory
              - "{{ kairos_directory }}/secrets"
          register: setup_result
          changed_when: "'Generated and validated the complete application key set' in setup_result.stdout"

        - name: Leave fresh local defaults as a protected template only
          ansible.builtin.copy:
            src: "{{ bootstrap_workspace.path }}/.env"
            dest: "{{ kairos_directory }}/production.env.example"
            remote_src: true
            force: false
            mode: '0600'
          when: not production_environment.stat.exists

      always:
        - name: Remove temporary setup files even after failure
          ansible.builtin.file:
            path: "{{ bootstrap_workspace.path }}"
            state: absent
          when: bootstrap_workspace.path is defined

    - name: Verify deployment account can reach Docker
      ansible.builtin.command: docker version
      become_user: "{{ kairos_deploy_user }}"
      changed_when: false
      tags: host

    - name: Check Compose deployment capabilities
      ansible.builtin.command:
        argv: [docker, compose, "{{ item }}", --help]
      loop: [up, config]
      register: compose_help
      changed_when: false
      tags: host

    - name: Require Compose options used by deployment
      ansible.builtin.assert:
        that:
          - "'--wait-timeout' in compose_help.results[0].stdout"
          - "'--no-path-resolution' in compose_help.results[1].stdout"
      tags: host

  handlers:
    - name: Validate and reload SSH
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      notify: Reload SSH

    - name: Reload SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
